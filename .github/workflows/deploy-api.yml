name: Deploy API

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy API to Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event.workflow_run.conclusion == 'success' && github.repository == 'sjd-labs/savspot'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install Vercel CLI
        run: pnpm add -g vercel@latest

      # Vercel's own build container is 8 GB and OOMs on this monorepo's
      # pnpm install. We do the install + build on the GitHub runner
      # (16 GB) and ship the prebuilt output, which avoids the OOM
      # entirely and is also faster (CI lockfile cache reuse).
      - name: Install workspace deps
        run: pnpm install --frozen-lockfile

      - name: Pull Vercel project settings
        working-directory: apps/api
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_API_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_API_PROJECT_ID }}
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build api bundle
        working-directory: apps/api
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_API_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_API_PROJECT_ID }}
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy prebuilt to Vercel
        working-directory: apps/api
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_API_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_API_PROJECT_ID }}
        run: vercel deploy --prebuilt --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
