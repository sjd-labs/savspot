name: Deploy API

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy API to Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event.workflow_run.conclusion == 'success' && github.repository == 'sjd-labs/savspot'
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_API_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_API_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install Vercel CLI
        run: pnpm add -g vercel@latest

      # Vercel's 8 GB build container OOMs on this monorepo's pnpm install,
      # and Vercel's NFT silently tags @savspot/* workspace deps with an
      # `.ignored_` prefix so they never ship. scripts/vercel-build.sh
      # works around both by doing install + build + pnpm-deploy on the
      # 16 GB GitHub runner, then shipping the prebuilt .vercel/output.
      - name: Pull Vercel project settings
        working-directory: apps/api
        run: vercel pull --yes --environment=production --token=$VERCEL_TOKEN

      - name: Build + deploy via prebuilt
        working-directory: apps/api
        run: ./scripts/vercel-build.sh --deploy
