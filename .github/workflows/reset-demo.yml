name: Reset Demo Tenant

on:
  schedule:
    - cron: '17 6 * * *' # 6:17 UTC daily
  workflow_dispatch: # manual trigger

permissions:
  contents: read

jobs:
  reset:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      # Connects directly to the Supabase Supavisor pooler. We previously
      # used `flyctl proxy 15432:5432 -a savspot-db` to reach Fly Postgres;
      # that's gone as part of the Fly → Supabase migration.
      - name: Reset demo tenant
        run: pnpm exec tsx scripts/admin/reset-demo.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
